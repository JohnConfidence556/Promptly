<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimpleCalc</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="main-container" class="calculator">
    <div id="display-area">0</div>
    <div class="keypad-grid">
      <button class="button number-button" data-value="1">1</button>
      <button class="button number-button" data-value="2">2</button>
      <button class="button operation-button" data-op="+">+</button>
      <button class="button operation-button" data-op="/">÷</button>
      <button id="clear-btn" class="button control-button" data-action="clear">C</button>
      <button id="equals-btn" class="button control-button" data-action="equals">=</button>
    </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
